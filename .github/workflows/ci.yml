name: DriftGuard CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Debug Repository
        run: |
          echo "Current Directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Recursive Tree:"
          find . -maxdepth 2

      - name: Compile Python Files
        run: |
          python -m compileall .

      - name: Validate Imports
        run: |
          python -c "import main"

          python -c "from app.parser.tfstate_parser import TFStateParser"

          python -c "from app.scanner.ec2_scanner import EC2Scanner"
          python -c "from app.scanner.sg_scanner import SGScanner"
          python -c "from app.scanner.s3_scanner import S3Scanner"

          python -c "from app.engine.drift_engine import DriftEngine"
          python -c "from app.engine.sg_drift_engine import SGDriftEngine"
          python -c "from app.engine.s3_drift_engine import S3DriftEngine"

          python -c "from app.report.report_generator import ReportGenerator"

      - name: Install Ruff
        run: |
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check .

      - name: Install Black
        run: |
          pip install black

      - name: Check Formatting
        run: |
          black --check .
